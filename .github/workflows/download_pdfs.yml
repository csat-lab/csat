# 수정안 (2026-11-16): 다운로드한 PDF를 저장소에 바로 커밋하도록 연결한다.
# 변경점 3가지:
# 1. permissions를 contents: write로 변경 (커밋/푸시 권한).
# 2. 다운로드 뒤 PDF 검증 단계를 추가한다. downloader.py 자체가 %PDF- 서명을
#    확인하고 임시 파일 검증 뒤 원자적으로 교체하므로, 정상 동작 시 이 단계는
#    아무것도 안 하고 지나간다. HTML 오기 같은 과거 사고의 재발을 막는 방벽이다.
# 3. 커밋 단계를 추가한다. downloader.py는 실패 파일이 하나라도 있으면 종료
#    코드 1을 반환하므로, 부분 성공분도 저장되게 if: always()를 단다.
#    새 파일만 커밋된다 (기존 유효 PDF는 downloader가 건너뛴다).
# 참고: 이 커밋은 GITHUB_TOKEN으로 만들어져 push 트리거를 깨우지 못하지만,
# parse-pdfs.yml은 workflow_run으로 연결돼 있어 다운로드 완료 뒤 자동 실행된다.
name: Download Horaeng English Exam PDFs

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First year to collect"
        required: true
        default: "2020"
        type: string

      end_year:
        description: "Last year to collect"
        required: true
        default: "2026"
        type: string

      overwrite:
        description: "Replace existing valid PDFs"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "15 2 * * 1"

permissions:
  contents: write

concurrency:
  group: horaeng-pdf-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download exam PDFs
        run: |
          python downloader.py \
            --start-year 2020 \
            --end-year $(date -u +%Y) \
            --output-dir data/raw

      - name: Validate downloaded PDFs
        if: always()
        run: |
          removed=0
          for pdf in data/raw/*.pdf; do
            [ -f "$pdf" ] || continue
            if ! head -c 5 "$pdf" | grep -q "%PDF-"; then
              echo "WARNING: not a PDF, removing before commit: $pdf"
              rm -f "$pdf"
              removed=$((removed+1))
            fi
          done
          echo "Removed $removed invalid file(s). Valid PDFs: $(ls data/raw/*.pdf | wc -l)"

      - name: Commit new PDFs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw/*.pdf
          if git diff --cached --quiet; then
            echo "No new PDFs to commit."
          else
            echo "Staged $(git diff --cached --name-only | wc -l) new/changed PDF(s)."
            git commit -m "Download new Horaeng English exam PDFs ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi

      - name: Upload downloaded PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horaeng-english-pdfs
          path: data/raw/*.pdf
          if-no-files-found: warn
          retention-days: 30
