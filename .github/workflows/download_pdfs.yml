name: Download Horaeng English Exam PDFs

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First year to collect"
        required: true
        default: "2020"
        type: string

      end_year:
        description: "Last year to collect"
        required: true
        default: "2026"
        type: string

      overwrite:
        description: "Replace existing valid PDFs"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "15 2 * * 1"

permissions:
  contents: read

concurrency:
  group: horaeng-pdf-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download exam PDFs
        run: |
          python downloader.py \
            --start-year 2020 \
            --end-year $(date -u +%Y) \
            --output-dir data/raw

      - name: Upload downloaded PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horaeng-english-pdfs
          path: data/raw/*.pdf
          if-no-files-found: warn
          retention-days: 30
