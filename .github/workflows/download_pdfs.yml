name: Scheduled PDF Downloader

on:
  schedule:
    # KST 화, 수, 목 00:00 (UTC 월, 화, 수 15:00)
    - cron: '0 15 * * 1,2,3'
  workflow_dispatch: # Actions 탭에서 수동 실행 가능하도록 설정

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 리포지토리에 변경사항을 커밋/푸시하기 위한 권한

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python script
        run: |
          # main.py 파일명 및 옵션 경로 확인 후 변경 가능
          python downloader.py --output-dir downloads/pdfs

      - name: Commit and Push downloaded files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: update new exam PDFs"
          file_pattern: "downloads/pdfs/*.pdf"
