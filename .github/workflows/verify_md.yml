name: Verify Restored Markdown

on:
  workflow_dispatch:
  push:
    paths:
      - "data/raw/md/*.md"
      - "data/output/*.md"
      - "scripts/verify_restoration.py"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run restoration verification
        run: python scripts/verify_restoration.py
