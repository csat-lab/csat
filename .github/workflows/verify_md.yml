# 수정안 (2026-11-16):
# 1. 경로 필터: data/output/*.md 는 학년 하위 폴더(고1/고2/고3)에 닿지 않으므로 **/*.md 로 수정.
# 2. workflow_run 트리거 추가: 파싱 워크플로의 봇 커밋은 GITHUB_TOKEN이라 push 트리거를
#    깨우지 못하므로, 파싱 완료 뒤 자동 검증을 위해 workflow_run으로 연결한다.
name: Verify Restored Markdown

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Parse exam PDFs with kordoc"]
    types: [completed]
  push:
    paths:
      - "data/raw/md/*.md"
      - "data/output/**/*.md"
      - "scripts/verify_restoration.py"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run restoration verification
        id: verify
        run: python scripts/verify_restoration.py

      - name: Create or update GitHub Issue on quality warning
        if: steps.verify.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_COUNT: ${{ steps.verify.outputs.issue_count }}
        run: |
          ISSUE_TITLE="[자동 검증] 원문 복원 품질 확인 필요 (${ISSUE_COUNT}건)"
          # 이미 열려 있는 동일한 제목 패턴의 이슈가 있는지 확인
          EXISTING_ISSUE=$(gh issue list --state open --search "[자동 검증] 원문 복원 품질 확인 필요 in:title" --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Updating existing issue #$EXISTING_ISSUE..."
            gh issue edit "$EXISTING_ISSUE" --title "$ISSUE_TITLE" --body-file /tmp/verify_issue_body.md
            gh issue comment "$EXISTING_ISSUE" --body "🔄 최신 커밋(${{ github.sha }}) 검증 결과로 본문이 업데이트되었습니다."
          else
            echo "Creating new issue..."
            gh issue create --title "$ISSUE_TITLE" --body-file /tmp/verify_issue_body.md
